[package]
name = "mc-host"
version = "1.0.0"
description = "The few host calls the shared backend modules make (emit an event, spawn a task), implemented without a web view"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
once_cell = "1"

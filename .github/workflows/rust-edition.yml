name: Rust edition

on:
  push:
    paths: ["rust/**", "renderer/**", "src/macos/Helper.swift", ".github/workflows/rust-edition.yml"]
  pull_request:
    paths: ["rust/**", "renderer/**", "src/macos/Helper.swift", ".github/workflows/rust-edition.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri
      - run: npm ci
      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Build and bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: mission-control-${{ matrix.os }}
          path: |
            rust/src-tauri/target/release/bundle/nsis/*.exe
            rust/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
